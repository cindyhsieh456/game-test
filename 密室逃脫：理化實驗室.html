<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>密室逃脫：理化實驗室</title>
<style>
:root{--bg:#e6f1f5;--card:#fff;--ink:#17262c;--mut:#587078;--pri:#0a8aa0;--acc:#e0912a;--bad:#c63d2b;--line:#bcd3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07121c;--card:#0d2130;--ink:#dff3f8;--mut:#7fa6b5;--pri:#33e1f0;--acc:#ffc857;--bad:#ff7a66;--line:#21465a}}
:root[data-theme="dark"]{--bg:#07121c;--card:#0d2130;--ink:#dff3f8;--mut:#7fa6b5;--pri:#33e1f0;--acc:#ffc857;--bad:#ff7a66;--line:#21465a}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.c{max-width:460px;margin:0 auto;padding:14px;text-align:center}
h1{font-size:22px;margin:6px 0}.m{color:var(--mut);font-size:14px;margin:6px 0}
.b{display:block;width:100%;padding:14px;margin:8px 0;border:2px solid var(--pri);border-radius:14px;background:var(--pri);color:#fff;font-size:18px;font-weight:700;font-family:inherit}
.b.o{background:var(--card);color:var(--ink);border-color:var(--line);font-weight:500}
.b.s{font-size:15px;padding:9px;background:none;color:var(--acc);border-color:var(--acc)}
.av{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px;margin:10px auto;width:150px;line-height:1.1}
.ah{font-size:38px;height:44px}.af{font-size:64px}.ab{font-size:44px;height:50px}
.wr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.wr button{padding:8px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:26px;color:var(--ink)}
.wr button small{display:block;font-size:11px;color:var(--mut)}.wr .on{border-color:var(--acc)}
.top{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
.lock{display:flex;gap:3px;justify-content:center;margin:8px 0}.lock i{flex:1;font-style:normal;background:var(--card);border:2px solid var(--line);border-radius:6px;padding:3px 0;font-size:14px}
.tm{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.tm b{display:block;height:100%;background:var(--pri)}
.cl{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;font-size:19px;line-height:1.7;text-align:left}
.k.ci{border:2px solid var(--bad);border-radius:999px;padding:0 6px;color:var(--bad)}
.md .k:not(.ci){outline:2px dashed var(--acc);outline-offset:2px;border-radius:4px}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.np button{padding:14px 0;font-size:22px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.dp{font-size:30px;font-weight:700;background:var(--card);border:2px solid var(--pri);border-radius:12px;padding:8px;margin:8px 0;min-height:44px}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.pc{background:var(--card);border:4px solid var(--bad);border-radius:22px;padding:22px;max-width:420px;width:100%;text-align:center;font-size:18px;line-height:1.6}
.pc h2{font-size:26px;margin:0 0 8px;color:var(--bad)}.pc.g{border-color:var(--pri)}.pc.g h2{color:var(--pri)}
.cl{border-left:4px solid var(--pri)}.lock i{border-color:var(--pri);color:var(--pri)}.k{cursor:pointer}.np button:disabled{opacity:.3}.dp b{color:var(--pri)}@keyframes sh{0%,100%{box-shadow:0 0 8px var(--acc)}50%{box-shadow:0 0 28px 8px var(--acc)}}@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.3)}}.rare{position:relative;display:inline-block;border-radius:22px;padding:12px 28px;border:2px solid var(--acc);animation:sh 1.6s infinite}.rare i{position:absolute;font-style:normal;font-size:22px;animation:tw 1.6s infinite}@media(prefers-reduced-motion:reduce){.rare,.rare i{animation:none}}.okb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;pointer-events:none;z-index:8;animation:pp .9s ease-out}@keyframes pp{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}@media(prefers-reduced-motion:reduce){.okb{animation:none}}html{-webkit-tap-highlight-color:transparent}button{cursor:pointer;transition:filter .08s,transform .08s,box-shadow .08s;box-shadow:0 2px 5px rgba(0,0,0,.25)}button:not(:disabled):active{filter:brightness(.75);transform:scale(.96);box-shadow:0 8px 18px rgba(0,0,0,.55)}button:disabled{box-shadow:none}</style></head><body><div id="app"></div><div id="pop"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const IT=[['🥼','實驗袍','b'],['🥽','護目鏡','h'],['🎧','耳機','h'],['🧥','外套','b'],['👑','皇冠','h']],CH=['🧒','👧','🤖','🐱','🦊'];
let S={clears:0,ch:0,wear:{h:-1,b:-1},w:[]},g={};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('sci')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sci',JSON.stringify(S))}catch(e){}};
const TM=[0,30,50,90],LV=['','基礎','中等','難題'];
const mc=(L,q,a,o,h)=>({L,q,a,mc:sh(o),h});
const cc=(L,q,ans,fr,w,h,u,sb,v)=>{const dc=[+(v[0]+10).toFixed(1),+(v[v.length-1]*2).toFixed(1)];return{L,q,ans,fr,fo:sh([fr,...w]),h,u,sb,v,ch:sh([...v,...dc])}};
const G={
b1:()=>mc(1,'[[密度]]的公式為何？（m：質量，V：體積）','d = m ÷ V',['d = m ÷ V','d = V ÷ m','d = m × V'],'密度 = 質量 ÷ 體積，常用單位 g/cm³。'),
b2:()=>{const[n,a]=P([['食鹽水','混合物'],['純水','純物質'],['糖水','混合物'],['氧氣','純物質'],['海水','混合物'],['純酒精','純物質']]);return mc(1,`${n}屬於[[純物質]]還是[[混合物]]？`,a,['純物質','混合物'],'純物質有固定的熔點、沸點；混合物由兩種以上物質混合，沒有固定性質。')},
b3:()=>{const n=P([2,5,8]);return mc(1,`水中農藥含量 ${n} [[ppm]]，代表什麼意思？`,`每 1,000,000 份溶液中含 ${n} 份溶質`,[`每 1,000,000 份溶液中含 ${n} 份溶質`,`每 100 份溶液中含 ${n} 份溶質`,`每 1,000 份溶液中含 ${n} 份溶質`],'ppm = 溶質 ÷ 溶液 × 10⁶（百萬分之一）。')},
b4:()=>{const n=P([12,13,14]);return mc(1,`紅酒酒精濃度 ${n} 度，代表 [[100 毫升]]紅酒中含有多少酒精？`,`${n} 毫升`,[`${n} 毫升`,`${n} 公克`,`${100-n} 毫升`],'酒精濃度「度」是體積百分濃度：100 毫升溶液中含幾毫升酒精。')},
m1:()=>{const V=P([10,20,25,40,50]),d=P([0.8,1.0,2.7,7.9,8.9,11.3]),m=+(d*V).toFixed(1);return cc(2,`某金屬塊[[質量 ${m} g]]、[[體積 ${V} cm³]]，密度為多少 g/cm³？`,d,'d = m ÷ V',['d = V ÷ m','d = m × V'],'密度 = 質量 ÷ 體積。','g/cm³','d = _ ÷ _',[m,V])},
m2:()=>{const V=P([10,20,25,40,50]),d=P([0.8,1.0,2.7,7.9,8.9]);return cc(2,`某物質[[密度 ${d} g/cm³]]，[[體積 ${V} cm³]]，質量為多少 g？`,+(d*V).toFixed(1),'m = d × V',['m = d ÷ V','m = V ÷ d'],'質量 = 密度 × 體積。','g','m = _ × _',[d,V])},
m3:()=>{const A=P([20,30,40]),v=P([5,10,15]),d=P([2.7,7.9,8.9]),m=+(d*v).toFixed(1);return cc(2,`量筒原有水[[${A} mL]]，放入質量[[${m} g]]的金屬塊（排水法），水面升到[[${A+v} mL]]，密度為多少 g/cm³？`,d,'d = m ÷ (V後 − V前)',['d = m ÷ V後','d = m × (V後 − V前)'],'排水法：物體體積 = 放入後刻度 − 放入前刻度。','g/cm³','d = _ ÷ (_ − _)',[m,A+v,A])},
m4:()=>{const T=P([50,100,200,250,400]),p=P([10,20,25,40]),s=T*p/100;return cc(2,`食鹽[[${s} g]]溶於水[[${T-s} g]]，重量百分濃度為多少 %？`,p,'濃度% = 溶質 ÷ (溶質＋溶劑) × 100%',['濃度% = 溶質 ÷ 溶劑 × 100%','濃度% = 溶劑 ÷ 溶液 × 100%'],'溶液 = 溶質 ＋ 溶劑，分母是「整杯溶液」。','%','濃度% = _ ÷ (_ + _) × 100',[s,s,T-s])},
m5:()=>{const T=P([50,100,200,250,400]),p=P([4,5,10,20,25]);return cc(2,`重量百分濃度[[${p}%]]的食鹽水[[${T} g]]，含食鹽多少 g？`,T*p/100,'溶質 = 溶液 × 濃度%',['溶質 = 溶液 ÷ 濃度%','溶質 = 溶液 − 濃度%'],'濃度% = 溶質 ÷ 溶液 × 100%，移項求溶質。','g','溶質 = _ × (_ ÷ 100)',[T,p])},
m6:()=>{const k=P([1,2,5,10,50]),p=P([2,3,4,5,8]);return cc(2,`某水溶液[[${k} kg]]中含溶質[[${k*p} mg]]，濃度為多少 ppm？`,p,'ppm = 溶質(mg) ÷ 溶液(kg)',['ppm = 溶質(mg) × 溶液(kg)','ppm = 溶質(g) ÷ 溶液(kg)'],'1 ppm = 1 mg/kg，也就是 溶質 ÷ 溶液 × 10⁶。','ppm','ppm = _ ÷ _',[k*p,k])},
m7:()=>{const T=P([100,200,250,500]),p=P([4,5,12,15]),a=T*p/100;return cc(2,`紅酒[[${T} mL]]中含酒精[[${a} mL]]，體積百分濃度為多少 %？`,p,'體積% = 溶質體積 ÷ 溶液體積 × 100%',['體積% = 溶液體積 ÷ 溶質體積 × 100%','體積% = 溶質體積 × 溶液體積'],'分母是整杯溶液的體積。','%','體積% = _ ÷ _ × 100',[a,T])},
h1:()=>{const k=P([10,20,30]),h=P([5,10,15]),m=+(2.7*k).toFixed(1);return cc(3,`鋁的密度 2.7 g/cm³。鋁球[[質量 ${m} g]]、[[體積 ${k+h} cm³]]，若為空心，空心部分體積為多少 cm³？`,h,'空心體積 = 球體積 − 質量 ÷ 密度',['空心體積 = 質量 ÷ 密度 − 球體積','空心體積 = 球體積 − 質量 × 密度'],'先用 V = m ÷ d 算出「實心鋁」的體積，再和球外觀體積比較。','cm³','空心體積 = _ − _ ÷ _',[k+h,m,2.7])},
h2:()=>{const T=P([100,200,300]),p=P([10,20,40]),W=T*P([1,3]);return cc(3,`[[${p}%]]、[[${T} g]] 的糖水中再[[加入]] ${W} g 的清水，新的重量百分濃度為多少 %？`,+(p*T/(T+W)).toFixed(1),'新濃度 = 原溶質 ÷ (原溶液＋加水) × 100%',['新濃度 = 原溶質 ÷ 加水 × 100%','新濃度 = 原濃度 × 加水 ÷ 原溶液'],'加水後溶質不變，溶液質量變大。先求原本的溶質。','%','新濃度 = (_ × (_ ÷ 100)) ÷ (_ + _) × 100',[T,p,T,W])},
h3:()=>{const[x,a]=P([[0.00012,0.12],[0.0005,0.5],[0.0008,0.8],[0.002,2]]);return cc(3,`某蔬菜農藥殘留量[[${x} g/kg]]，換算成 [[ppm]] 是多少？（1 ppm = 1 mg/kg）`,a,'ppm = g/kg × 1000',['ppm = g/kg × 100','ppm = g/kg ÷ 1000'],'1 g = 1000 mg，所以 1 g/kg = 1000 mg/kg。','ppm','ppm = _ × 1000',[x])},
b5:()=>pool(1,[['使用[[酒精燈]]時，酒精量最好裝多少？','容量的 1/2 ~ 2/3',['容量的 1/10','裝滿到瓶口'],'酒精燈盛裝酒精約 1/2 ~ 2/3，不可裝滿。'],['酒精燈使用完畢後，應如何[[熄滅]]？','用燈罩蓋熄',['用嘴吹熄','用手搧熄'],'熄滅酒精燈要用燈罩蓋住，不可用嘴吹。'],['稀釋[[濃硫酸]]時，正確做法是？','將濃硫酸沿玻璃棒緩緩加入水中',['將水倒入濃硫酸中','兩者快速倒在一起'],'酸入水：把濃硫酸慢慢加入水中，避免噴濺。'],['要辨別藥品的[[氣味]]，正確方法是？','用手掌搧動氣體，再輕輕聞',['把鼻子靠近瓶口直接聞','用力深吸一口'],'不可直接聞，要用手搧聞。'],['[[攪拌]]溶液時，正確的做法是？','用玻璃棒攪拌',['用溫度計攪拌','用手指攪拌'],'溫度計易破損，不可拿來攪拌。'],['用[[試管]]加熱液體時，管口應？','斜向上、不對著人',['對著自己','對著旁邊的同學'],'管口不可朝向人，避免液體噴濺傷人。']]),
b6:()=>{const N=P([12,25,35,48]),[sc,d]=P([['1 cm',1],['0.1 cm（1 mm）',2],['0.01 cm',3]]),f=k=>`${N}${k?'.'+'0'.repeat(k):''} cm`;return mc(1,`直尺的最小刻度為[[${sc}]]，物體長度剛好對齊[[${N} cm]]的刻度，應記錄為？`,f(d),[f(d-1),f(d),f(d+1)],'記錄 = 準確值 ＋ 最小刻度下一位的估計值（估計值可以是 0）。')},
b7:()=>pool(1,[['[[溶解度]] 111 g/100 g 水，代表什麼意思？','此溫度下，100 g 水最多可溶解 111 g',['100 g 水中一定含有 111 g','溶液濃度為 111%'],'溶解度：某溫度下，100 g 水「最多」能溶解的溶質克數。'],['杯底還有[[未溶解]]的糖，這杯糖水屬於？','飽和溶液',['未飽和溶液','純物質'],'溶質無法再溶解、還有剩餘時，就是飽和溶液。'],['飽和糖水[[降溫]]後杯底出現糖粒，是因為？','溫度降低，溶解度變小',['糖的質量變大','水變少了'],'多數固體溶質溫度越低，溶解度越小。'],['要讓[[未飽和]]糖水變成飽和，可行的方法是？','再加入更多糖',['再加入更多水','把糖水稀釋'],'加溶質、降溫或蒸發水，都可能達到飽和。']]),
b8:()=>pool(1,[['冰塊會[[浮]]在水面上，是因為？','冰的密度比水小',['冰的質量比水小','冰的體積比水大'],'冰約 0.9 g/cm³，小於水的 1.0 g/cm³。'],['冰塊[[融化]]成水後，下列何者不變？','質量',['體積','密度'],'質量不隨狀態改變；密度變大、體積變小。'],['冰融化成水，[[體積]]會？','變小',['變大','不變'],'質量不變、密度變大，所以體積變小。']]),
m8:()=>{const b=P([1,2]),c=P([1,2,3]),e=P([1,2,3]),q=cc(2,`上皿天平平衡時，右盤的砝碼如圖（100 mg = 0.1 g）。物體[[質量]]為多少 g？`,+(50+10*b+c+.1*e).toFixed(1),'質量 = 所有砝碼質量的總和',['質量 = 最大砝碼的質量','質量 = 砝碼個數 × 50'],'每種砝碼「個數 × 質量」加起來，注意 100 mg = 0.1 g。','g','質量 = 50 + _ + _ + _',[10*b,c,+(.1*e).toFixed(1)]);q.svg=gw([['50 g',1],['10 g',b],['1 g',c],['100 mg',e]]);return q},
m9:()=>{const V=P([10,20,30,40,50]);return cc(2,`冰的密度 0.9 g/cm³，冰塊[[質量 ${+(.9*V).toFixed(1)} g]]，體積為多少 cm³？`,V,'V = m ÷ d',['V = m × d','V = d ÷ m'],'體積 = 質量 ÷ 密度。','cm³','V = _ ÷ _',[+(.9*V).toFixed(1),.9])},
m10:()=>{const w=P([100,200]),s=P([20,36,40]),a=s*w/100+P([10,20]);return cc(2,`X 物質的[[溶解度]]為 ${s} g/100 g 水。在[[${w} g 水]]中放入[[${a} g]] X，充分攪拌後，未溶解的有多少 g？`,a-s*w/100,'未溶解 = 放入量 − 最多可溶量',['未溶解 = 最多可溶量 − 放入量','未溶解 = 放入量 ＋ 最多可溶量'],w==100?'水正好 100 g，最多可溶量就是溶解度。':'先算水最多能溶多少：溶解度 × 水量 ÷ 100。','g',w==100?'未溶解 = _ − _':'未溶解 = _ − (_ × (_ ÷ 100))',w==100?[a,s]:[a,s,w])},
m11:()=>{const g=P([500,1000,2000]),pp=P([20,50,70]);return cc(2,`消毒液[[質量 ${g} g]]、濃度[[${pp} ppm]]，含溶質多少 mg？（1 ppm = 1 mg/kg）`,pp*g/1000,'溶質(mg) = ppm × 溶液(kg)',['溶質(mg) = ppm ÷ 溶液(kg)','溶質(mg) = ppm × 溶液(g)'],'先把 g 換成 kg（÷ 1000）。','mg','溶質(mg) = _ × (_ ÷ 1000)',[pp,g])},
i1:()=>{const V=P([10,20,25,40]),d=P([0.8,1.2,2.5,2.7,7.9]),m=+(d*V).toFixed(1),q=cc(2,`圖為某物質[[質量 m]]與[[體積 V]]的關係，虛線標出線上一點。此物質密度為多少 g/cm³？`,d,'d = m ÷ V',['d = V ÷ m','d = m × V'],'讀出虛線對應的 m 與 V，密度 = m ÷ V。','g/cm³','d = _ ÷ _',[m,V]);q.svg=gv(V,m);return q},
i2:()=>{const A=P([20,30]),v=P([5,10,15]),d=P([2.7,7.9,8.9]),m=+(d*v).toFixed(1),q=cc(2,`圖為金屬塊放入量筒（排水法）前後的水面，金屬塊[[質量 ${m} g]]，密度為多少 g/cm³？`,d,'d = m ÷ (V後 − V前)',['d = m ÷ V後','d = m × (V後 − V前)'],'先讀出前後刻度，相減才是金屬塊的體積。','g/cm³','d = _ ÷ (_ − _)',[m,A+v,A]);q.svg=gd(A,A+v);return q},
h4:()=>{const[p,t]=P([[30,10],[20,10],[40,10],[40,20]]),T=P([100,200,400]);return cc(3,`[[${p}%]]、[[${T} g]] 的食鹽水中，要[[加入]]多少 g 的水，才能稀釋成 ${t}%？`,T*(p/t-1),'加水量 = 溶質 ÷ 目標濃度% × 100 − 原溶液',['加水量 = 溶質 ÷ 目標濃度%','加水量 = 原溶液 × 目標濃度%'],'加水後溶質不變，先求溶質，再求稀釋後的總質量。','g','加水量 = (_ × (_ ÷ 100)) ÷ (_ ÷ 100) − _',[T,p,t,T])},
